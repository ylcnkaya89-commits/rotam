name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Prepare Web Assets
      run: |
        mkdir -p www
        cp index.html app.js styles.css places_data.js www/
        sed -i 's/"webDir": "."/"webDir": "www"/' capacitor.config.json

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Add Location Permissions
      run: |
        python3 -c "
        import os
        path = 'android/app/src/main/AndroidManifest.xml'
        with open(path, 'r') as f:
            content = f.read()
        
        # Replace the self-closing INTERNET tag that Capacitor generates
        permissions = '<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n<uses-feature android:name=\"android.hardware.location.gps\" />'
        
        # Try both formats (with and without space before />)
        content = content.replace('<uses-permission android:name=\"android.permission.INTERNET\" />', permissions)
        content = content.replace('<uses-permission android:name=\"android.permission.INTERNET\"/>', permissions)
        
        with open(path, 'w') as f:
            f.write(content)
        "

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build APK
      working-directory: ./android
      run: bash ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

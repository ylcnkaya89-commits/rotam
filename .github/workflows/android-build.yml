name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/geolocation

    - name: Prepare Web Assets
      run: |
        mkdir www
        cp index.html app.js styles.css places_data.js www/
        sed -i 's/"webDir": "."/"webDir": "www"/' capacitor.config.json

    - name: Add Android Platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Add Location Permissions
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a\
        <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\
        <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\
        <uses-feature android:name="android.hardware.location.gps" />' $MANIFEST

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build APK
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
